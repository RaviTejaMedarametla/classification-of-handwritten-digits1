name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-lock.txt
      - name: Run unit tests with coverage
        run: pytest --cov=research --cov=compression --cov=benchmarks --cov=deployment --cov-report=term-missing
      - name: Smoke training
        run: python -m research.train_cli --model knn --dataset digits --sample-size 200
      - name: Compression benchmark smoke
        run: python -m research.evaluate_cli --model rf --dataset digits --sample-size 300 --runs 1 --run-model-compression
      - name: ONNX parity check
        run: python -m research.infer_cli --model knn --dataset digits --export-onnx --onnx-min-agreement 0.98
      - name: Experiment script import/no-output mode
        run: python -c "from results.run_all_experiments import main; main(non_output_mode=True)"
